name: Frontend CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    name: Build Frontend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # pnpm se fija a la major 10, la misma que corre en el servidor. Con
      # "latest" el runner instalaba un pnpm que ya exige Node mas nuevo que el
      # 20 de este job y el paso fallaba con ERR_UNKNOWN_BUILTIN_MODULE.
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # NO BLOQUEANTE DE FORMA TEMPORAL. El repo nunca tuvo configuracion de
      # ESLint, asi que "next lint" no comprobaba nada; al habilitarlo de verdad
      # afloran 16 errores preexistentes en codigo de la plantilla (entre ellos
      # un react/jsx-no-undef real en ElementFlower.jsx). Quitar
      # continue-on-error en cuanto esos errores esten corregidos.
      - name: Lint
        run: pnpm run lint
        continue-on-error: true

      - name: Build
        run: pnpm run build

  # La imagen se construye aqui y no en el servidor: la instancia tiene 908 MiB
  # de RAM y el OOM killer abortaba los builds nativos.
  # Se ejecuta tambien en los pull request, pero solo publica desde main: asi el
  # PR valida que la imagen compila sin ensuciar el registro.
  docker-image:
    name: Build and Push Image
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # NEXT_PUBLIC_API_URL se incrusta en el bundle del navegador durante el
      # build, no se lee en tiempo de ejecucion, por lo que debe entrar como
      # argumento de construccion.
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.ref == 'refs/heads/main' }}
          build-args: |
            NEXT_PUBLIC_API_URL=${{ vars.NEXT_PUBLIC_API_URL || 'http://3.138.243.36:8001' }}
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: docker-image
    if: github.ref == 'refs/heads/main'
    environment: production
    permissions:
      contents: read
      packages: read

    steps:
      # El paquete de GHCR es privado, por lo que el servidor debe autenticarse.
      # Se usa el GITHUB_TOKEN del propio run, valido solo durante el despliegue.
      - name: Deploy to Production Server
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.PRODUCTION_HOST }}
          username: ${{ secrets.PRODUCTION_USERNAME }}
          key: ${{ secrets.PRODUCTION_SSH_KEY }}
          port: ${{ secrets.PRODUCTION_PORT || 22 }}
          envs: GHCR_ACTOR,GHCR_TOKEN
          script: |
            set -e
            cd /var/www/Suminia

            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_ACTOR" --password-stdin
            docker compose -f docker-compose.prod.yml pull frontend
            docker compose -f docker-compose.prod.yml up -d frontend
            docker logout ghcr.io
            docker image prune -f
        env:
          GHCR_ACTOR: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
